name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Checksum of the shipped page
        run: sha256sum index.html
      - name: Unit tests (CSP check, SHA-512, ed25519 RFC 8032, base58, official-client known answers, live poa.mjs cross-check)
        run: npm run test:unit
      - run: npx playwright install --with-deps chromium firefox webkit
      - name: E2E smoke tests (Chromium, Firefox, WebKit, emulated phones; 10 viewports)
        run: npm run test:e2e
      - name: Upload screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-and-report
          path: |
            screenshots/
            playwright-report/
          retention-days: 14
